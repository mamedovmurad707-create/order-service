databaseChangeLog:
  - changeSet:
      id: 001-create-order-table
      author: order-service
      changes:
        - createTable:
            schemaName: public
            tableName: order
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: public
            tableName: order
            indexName: idx_order_user_id
            columns:
              - column:
                  name: user_id
